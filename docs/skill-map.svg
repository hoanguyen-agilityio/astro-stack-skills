<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d">
  <title id="t">web-dev-stack skill map</title>
  <desc id="d">Start: /ticket pushes an analysis for review, /analyze-task writes criteria and a plan, /code-skeleton sets up the project once. Build: /integrate-api adds typed services, /develop-feature builds the page and ends with a report. Check: /verify runs the seven gates in a loop, then /review-code reviews and fixes up to three rounds, then /web-quality audits the pages. Four hooks run on their own; /incident writes up a production incident.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7ea2ff"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0b45c"/>
    </marker>
    <style>
      .bg { fill: #0f141a; }
      .group { fill: #131a22; stroke: #2b3744; stroke-width: 1; }
      .glabel { fill: #9aa7b5; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.12em; }
      .node { fill: #161d25; stroke: #7ea2ff; stroke-width: 1.5; }
      .node.loop { stroke: #f0b45c; }
      .node.hook { stroke: #e87979; }
      .node.done { stroke: #5fd39a; }
      .name { fill: #e6ebf1; font: 600 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .sub { fill: #9aa7b5; font: 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .step { fill: #7ea2ff; }
      .stepn { fill: #0f141a; font: 700 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .edge { fill: none; stroke: #7ea2ff; stroke-width: 1.6; stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
      .edge.amber { stroke: #f0b45c; }
      .elabel { fill: #c6d0db; font: 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .dot { fill: #e6ebf1; }
      .dot.amber { fill: #f0b45c; }
      .pop { opacity: 0; animation: pop 0.5s ease-out forwards; }
      @keyframes flow { to { stroke-dashoffset: -12; } }
      @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .edge { animation: none; }
        .pop { animation: none; opacity: 1; }
        .dot { display: none; }
      }
    </style>
  </defs>

  <rect class="bg" width="1000" height="600" rx="16"/>

  <!-- groups -->
  <rect class="group" x="20" y="40" width="300" height="400" rx="12"/>
  <text class="glabel" x="36" y="64">START · ANALYSE, SET UP ONCE</text>
  <rect class="group" x="350" y="40" width="300" height="400" rx="12"/>
  <text class="glabel" x="366" y="64">BUILD · EVERY FEATURE</text>
  <rect class="group" x="680" y="40" width="300" height="400" rx="12"/>
  <text class="glabel" x="696" y="64">CHECK · EVERY CHANGE</text>
  <rect class="group" x="20" y="460" width="465" height="120" rx="12"/>
  <text class="glabel" x="36" y="484">ALWAYS ON</text>
  <rect class="group" x="515" y="460" width="465" height="120" rx="12"/>
  <text class="glabel" x="531" y="484">WHEN PRODUCTION BREAKS</text>

  <!-- edges (drawn first so nodes sit on top) -->
  <path id="p-ticket-analyze" class="edge" d="M170 154 L170 198" marker-end="url(#arrow)"/>
  <path id="p-analyze-skeleton" class="edge" d="M170 264 L170 308" marker-end="url(#arrow)"/>
  <path id="p-skeleton-api" class="edge" d="M300 342 C 335 342, 335 122, 368 122" marker-end="url(#arrow)"/>
  <path id="p-api-feature" class="edge" d="M500 154 L500 198" marker-end="url(#arrow)"/>
  <path id="p-feature-report" class="edge" d="M500 264 L500 308" marker-end="url(#arrow)"/>
  <path id="p-feature-verify" class="edge amber" d="M630 232 C 665 232, 665 122, 698 122" marker-end="url(#arrow-amber)"/>
  <path id="p-verify-review" class="edge amber" d="M830 154 L830 198" marker-end="url(#arrow-amber)"/>
  <path id="p-review-quality" class="edge" d="M830 264 L830 308" marker-end="url(#arrow)"/>

  <!-- edge labels -->
  <text class="elabel" x="180" y="180">same analysis</text>
  <text class="elabel" x="180" y="290">new project</text>
  <text class="elabel" x="510" y="180">data for the page</text>
  <text class="elabel" x="510" y="290">ends with</text>
  <text class="elabel" x="840" y="180">then runs</text>
  <text class="elabel" x="840" y="290">pages in scope</text>

  <!-- start -->
  <g class="pop" style="animation-delay: 0.05s">
    <rect class="node" x="40" y="88" width="260" height="64" rx="10"/>
    <text class="name" x="56" y="115">/ticket</text>
    <text class="sub" x="56" y="136">analysis on its own branch, for review</text>
  </g>
  <g class="pop" style="animation-delay: 0.2s">
    <rect class="node" x="40" y="200" width="260" height="64" rx="10"/>
    <text class="name" x="56" y="227">/analyze-task</text>
    <text class="sub" x="56" y="248">request → criteria, questions, plan</text>
    <circle class="step" cx="282" cy="218" r="9"/><text class="stepn" x="282" y="222" text-anchor="middle">1</text>
  </g>
  <g class="pop" style="animation-delay: 0.35s">
    <rect class="node" x="40" y="310" width="260" height="64" rx="10"/>
    <text class="name" x="56" y="337">/code-skeleton</text>
    <text class="sub" x="56" y="358">project with all 7 gates passing</text>
    <circle class="step" cx="282" cy="328" r="9"/><text class="stepn" x="282" y="332" text-anchor="middle">2</text>
  </g>

  <!-- build -->
  <g class="pop" style="animation-delay: 0.5s">
    <rect class="node" x="370" y="88" width="260" height="64" rx="10"/>
    <text class="name" x="386" y="115">/integrate-api</text>
    <text class="sub" x="386" y="136">Effect services, Schema types, helpers</text>
    <circle class="step" cx="612" cy="106" r="9"/><text class="stepn" x="612" y="110" text-anchor="middle">3</text>
  </g>
  <g class="pop" style="animation-delay: 0.65s">
    <rect class="node" x="370" y="200" width="260" height="64" rx="10"/>
    <text class="name" x="386" y="227">/develop-feature</text>
    <text class="sub" x="386" y="248">page, islands, every state, tests</text>
    <circle class="step" cx="612" cy="218" r="9"/><text class="stepn" x="612" y="222" text-anchor="middle">4</text>
  </g>
  <g class="pop" style="animation-delay: 0.8s">
    <rect class="node done" x="370" y="310" width="260" height="64" rx="10"/>
    <text class="name" x="386" y="337">report</text>
    <text class="sub" x="386" y="358">result, review table, criteria → tests</text>
  </g>

  <!-- check -->
  <g class="pop" style="animation-delay: 0.95s">
    <rect class="node loop" x="700" y="88" width="260" height="64" rx="10"/>
    <text class="name" x="716" y="115">/verify</text>
    <text class="sub" x="716" y="136">7 gates in a loop, ≤ 5 runs</text>
  </g>
  <g class="pop" style="animation-delay: 1.1s">
    <rect class="node" x="700" y="200" width="260" height="64" rx="10"/>
    <text class="name" x="716" y="227">/review-code</text>
    <text class="sub" x="716" y="248">duplicates, conventions; fix, ≤ 3 rounds</text>
    <circle class="step" cx="942" cy="218" r="9"/><text class="stepn" x="942" y="222" text-anchor="middle">5</text>
  </g>
  <g class="pop" style="animation-delay: 1.25s">
    <rect class="node" x="700" y="310" width="260" height="64" rx="10"/>
    <text class="name" x="716" y="337">/web-quality</text>
    <text class="sub" x="716" y="358">performance, a11y, SEO, security</text>
  </g>

  <!-- always on, incidents -->
  <g class="pop" style="animation-delay: 1.4s">
    <rect class="node hook" x="40" y="498" width="425" height="64" rx="10"/>
    <text class="name" x="56" y="525">4 hooks</text>
    <text class="sub" x="56" y="546">lint each edit · block dev/stag/prod pushes · checklist</text>
  </g>
  <g class="pop" style="animation-delay: 1.55s">
    <rect class="node" x="535" y="498" width="425" height="64" rx="10"/>
    <text class="name" x="551" y="525">/incident</text>
    <text class="sub" x="551" y="546">report, root cause and actions on their own branch</text>
  </g>

  <!-- moving dots along the main route -->
  <circle class="dot" r="4">
    <animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p-ticket-analyze" xlink:href="#p-ticket-analyze"/></animateMotion>
  </circle>
  <circle class="dot" r="4">
    <animateMotion dur="1.6s" begin="-0.3s" repeatCount="indefinite"><mpath href="#p-analyze-skeleton" xlink:href="#p-analyze-skeleton"/></animateMotion>
  </circle>
  <circle class="dot" r="4">
    <animateMotion dur="2.6s" begin="-0.6s" repeatCount="indefinite"><mpath href="#p-skeleton-api" xlink:href="#p-skeleton-api"/></animateMotion>
  </circle>
  <circle class="dot" r="4">
    <animateMotion dur="1.6s" begin="-0.9s" repeatCount="indefinite"><mpath href="#p-api-feature" xlink:href="#p-api-feature"/></animateMotion>
  </circle>
  <circle class="dot amber" r="4">
    <animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite"><mpath href="#p-feature-verify" xlink:href="#p-feature-verify"/></animateMotion>
  </circle>
  <circle class="dot amber" r="4">
    <animateMotion dur="1.6s" begin="-1.5s" repeatCount="indefinite"><mpath href="#p-verify-review" xlink:href="#p-verify-review"/></animateMotion>
  </circle>
  <circle class="dot" r="4">
    <animateMotion dur="1.6s" begin="-1.8s" repeatCount="indefinite"><mpath href="#p-review-quality" xlink:href="#p-review-quality"/></animateMotion>
  </circle>
</svg>
