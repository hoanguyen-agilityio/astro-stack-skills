name: Claude Code Review

# One review per ready pull request, re-run on every push: bugs in code (hooks, the installer, the templates inside
# skills) and the repo's own rules for instructions (skills, references, commands). It ends in a VERDICT line and the
# last step fails the check on NEEDS_CHANGES or when the review did not run.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push cancels the review of the commit it replaces.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Dependabot's pull requests only bump a version, CI checks them, and GitHub gives them no access
    # to Actions secrets, so the review could only fail for want of the token.
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A rebase onto a newer base need not pay for a new review when it left the pull request's own changes exactly
      # as reviewed: same patch-id as the previous head, and that head's review passed. A conflict fix changes the
      # patch, so it is reviewed again. CI still re-runs lint and tests.
      - name: Skip when a rebase left the reviewed changes as they were
        id: same
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          prev=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BEFORE/check-runs" --jq '[.check_runs[] | select(.name == "claude-review")][0].conclusion' 2>/dev/null || true)
          if [ "$prev" != "success" ]; then echo "previous review: ${prev:-none}"; exit 0; fi
          git fetch -q origin "$BEFORE" "$BASE" || exit 0
          pid() { git diff "$(git merge-base "origin/$BASE" "$1")" "$1" | git patch-id --stable | cut -d' ' -f1; }
          if [ -n "$(pid "$BEFORE")" ] && [ "$(pid "$BEFORE")" = "$(pid "$AFTER")" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Only a rebase: the pull request's changes are identical to ${BEFORE:0:7}, whose review passed. That review stands."
          fi

      - name: Run Claude Code Review
        id: claude-review
        if: steps.same.outputs.same != 'true'
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          claude_args: '--allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Review the whole pull request as it stands now (gh pr diff), not only the last commit.
            This repo holds the web-dev-stack Claude Code plugin (skills for Astro + React islands + TypeScript +
            Effect + oRPC + shadcn/ui). Read AGENTS.md first and check the change against every rule in it. Then
            review each changed file by its kind.

            Code (hooks/*.mjs, bin/*.mjs, scripts/*.mjs, .github/workflows/*, and the TypeScript, Astro and config templates
            inside skills/**):
            - Bugs in the changed lines: wrong logic, unhandled errors, off-by-one, wrong exit codes, broken paths.
            - Security: shell input not quoted, secrets printed or logged, a write outside the repo, a token in a URL.
            - Hooks never stop the user's work on their own failure, and each changed hook behaviour has a test in
              hooks/__test__/.
            - Templates follow the conventions table in AGENTS.md (Effect Schema at the boundary, no any, tokens
              from DESIGN.md, one folder per component with stories and tests).

            Instructions (skills/**, references, commands/, README.md, AGENTS.md, docs/architecture.md): another Claude
            follows these, so review them as instructions.
            - Every skill, file, script, command or tool they refer to exists in this repo or is a standard Claude
              Code tool. A reference to something that only exists in another open pull request is blocking.
            - No two skills or references contradict each other, or the tech stack versions and conventions in
              AGENTS.md.
            - No skill tells Claude to read .env or key files, push to main/dev/stag/prod, use --no-verify, force
              push, hand-edit generated files, or deploy outside /release.
            - Anything a skill relies on that may be missing (a CLI login, a branch, a config file) has a stated
              fallback.
            - Outputs have a fixed shape (template, file name), so two runs give the same result.
            - A change in what users see or run comes with README.md updated, and a design decision with docs/architecture.md.

            The pull request description says what changed and how it was checked; an empty one is blocking.
            Do not repeat what CI already checks (ESLint, Prettier, scripts/check-plugin.mjs, the Node tests,
            claude plugin validate, skill-validator, the installer job).
            Blocking means a concrete problem you can point to with file and line and explain how it breaks something.
            Anything you are unsure of goes under Minor, never Blocking.
            Write the review in English: first a one-line verdict (Ready to merge / Needs changes), then
            "Blocking" and "Minor" lists, each item with file and line. If there is nothing to flag, say so in one line.
            Any blocking item means Needs changes.
            Also post each Blocking item as an inline comment on its line (mcp__github_inline_comment__create_inline_comment),
            one per item; Minor items stay in the summary only.
            End your final message with one line: "VERDICT:" then a space, then READY or NEEDS_CHANGES.
            The next CI step reads that line and fails the check on NEEDS_CHANGES.

      # A review that did not run must not pass silently. The one exception is a pull request that edits this
      # workflow: claude-code-action refuses to run a workflow file that differs from main's, so it cannot review it.
      - name: Fail when the review asks for changes or did not run
        if: always()
        env:
          OUT: ${{ steps.claude-review.outputs.execution_file }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SAME: ${{ steps.same.outputs.same }}
        run: |
          if [ "$SAME" = "true" ]; then echo "review skipped: rebase only, previous review passed"; exit 0; fi
          if [ -z "$OUT" ] || [ ! -f "$OUT" ]; then
            if gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only | grep -qx '.github/workflows/claude-code-review.yml'; then
              echo "::notice::This pull request edits the review workflow, which the action will not run on. Review it by hand; the new review runs from the next pull request."
              exit 0
            fi
            echo "::error::The Claude review did not run (see the step above). Re-run this job; a pull request cannot pass without a review."
            exit 1
          fi
          verdict=$(jq -r '.. | strings' "$OUT" | grep -oE 'VERDICT: (READY|NEEDS_CHANGES)' | tail -1 || true)
          echo "${verdict:-no verdict found}"
          if [ "$verdict" != "VERDICT: READY" ]; then
            echo "::error::Claude review did not approve this pull request. Read its comment, fix the blocking items, push again."
            exit 1
          fi
